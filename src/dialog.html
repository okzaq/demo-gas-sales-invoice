<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <style>
      body { font-family: "Noto Sans JP", "Hiragino Sans", "Meiryo", sans-serif; font-size: 13px; color: #222; margin: 0; padding: 4px 8px; }
      label { display: block; margin: 12px 0 4px; font-weight: bold; }
      select { width: 100%; padding: 6px; font-size: 13px; }
      .hint { color: #666; font-size: 12px; margin-top: 4px; }
      button { margin-top: 16px; padding: 8px 20px; font-size: 13px; background: #1a73e8; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
      button:disabled { background: #9bb8e8; cursor: default; }
      #status { margin-top: 14px; white-space: pre-wrap; }
      .error { color: #c62828; }
      ul { padding-left: 18px; margin: 6px 0; }
      li { margin: 2px 0; }
      .amount { color: #555; }
    </style>
  </head>
  <body data-mode="<?= mode ?>">
    <label for="month">請求月</label>
    <select id="month"><option>読み込み中…</option></select>
    <div class="hint">締め日が20日の取引先なら、「9月分」は 8/21〜9/20 の売上です。</div>

    <div id="customerBlock">
      <label for="customer">取引先</label>
      <select id="customer"></select>
    </div>

    <button id="run" disabled>PDFを作成</button>
    <div id="status"></div>

    <script>
      var MODE = document.body.getAttribute("data-mode");
      var run = document.getElementById("run");
      var status = document.getElementById("status");

      if (MODE === "all") {
        document.getElementById("customerBlock").style.display = "none";
        run.textContent = "全取引先分のPDFを作成";
      }

      function option(value, label) {
        var o = document.createElement("option");
        o.value = value;
        o.textContent = label;
        return o;
      }

      function showError(e) {
        status.className = "error";
        status.textContent = (e && e.message) || String(e);
        run.disabled = false;
      }

      google.script.run
        .withSuccessHandler(function (data) {
          var month = document.getElementById("month");
          month.innerHTML = "";
          data.months.forEach(function (m) { month.appendChild(option(m.value, m.label)); });
          month.value = data.defaultMonth;
          var customer = document.getElementById("customer");
          data.customers.forEach(function (c) { customer.appendChild(option(c.code, c.code + "  " + c.name)); });
          run.disabled = data.months.length === 0;
          if (data.months.length === 0) status.textContent = "売上入力にデータがありません。";
        })
        .withFailureHandler(showError)
        .getDialogData();

      run.addEventListener("click", function () {
        var month = document.getElementById("month").value;
        var customer = MODE === "all" ? "ALL" : document.getElementById("customer").value;
        run.disabled = true;
        status.className = "";
        status.textContent = "作成中です…（1件あたり数秒かかります）";
        google.script.run
          .withSuccessHandler(function (r) {
            status.innerHTML = "";
            var head = document.createElement("div");
            head.textContent = r.monthLabel + ": " + r.created.length + "件作成しました。";
            status.appendChild(head);
            if (r.created.length > 0) {
              var ul = document.createElement("ul");
              r.created.forEach(function (c) {
                var li = document.createElement("li");
                var a = document.createElement("a");
                a.href = c.url;
                a.target = "_blank";
                a.textContent = c.name;
                var amount = document.createElement("span");
                amount.className = "amount";
                amount.textContent = "  ¥" + c.total.toLocaleString("ja-JP");
                li.appendChild(a);
                li.appendChild(amount);
                ul.appendChild(li);
              });
              status.appendChild(ul);
              var folder = document.createElement("a");
              folder.href = r.folderUrl;
              folder.target = "_blank";
              folder.textContent = "保存先フォルダを開く";
              status.appendChild(folder);
            }
            if (r.skipped.length > 0) {
              var s = document.createElement("div");
              s.className = "hint";
              s.textContent = "対象期間の売上がないため作成しなかった取引先: " + r.skipped.join("、");
              status.appendChild(s);
            }
            if (r.notDone.length > 0) {
              var n = document.createElement("div");
              n.className = "error";
              n.textContent = "時間切れのため未作成（もう一度実行してください）: " + r.notDone.join("、");
              status.appendChild(n);
            }
            run.disabled = false;
          })
          .withFailureHandler(showError)
          .createInvoices(month, customer);
      });
    </script>
  </body>
</html>
